<!DOCTYPE html>
<html class="" lang="en" xmlns:th="www.thymeleaf.org" th:fragment="parent(container, body, title )">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title -->
  <title th:replace="${title}">Base Content</title>

  <!-- FontAwesome -->
  <script src="https://kit.fontawesome.com/7ce82591bd.js" crossorigin="anonymous"></script>

  <!-- Flowbite CSS -->
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />

  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=routine" />

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>

  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{'/css/output.css'}">
  <link rel="stylesheet" th:href="@{'/css/buttons.css'}">
</head>

<body class=" p-6 "> <!-- adjust 16 to your navbar height -->


  <!-- ==========loggedin user based conditional============== -->
  <div th:if="${loggedInUser}">
    <div th:insert="~{/user/user_nav :: usernav }"></div>
  </div>

  <div th:unless="${loggedInUser}">
    <div th:insert="~{/utility/navbar :: navbar}"></div>

  </div>
  <!-- ============================================================ -->
  <!-- 
  <h1 class="text-red-500">This is Base Content</h1> -->

  <div th:replace="${container}"> </div>
  <div th:replace="${body}"> </div>



  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>

  <script th:src="@{'/js/contactdetails.js'}"></script>

  <script th:src="@{'/js/akash.js'}"></script>
  <script th:src="@{'/js/script.js'}"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


  <!-- =======Excel FORMAT EXPORT CDN============================== -->

  <script src="https://cdn.jsdelivr.net/npm/@linways/table-to-excel@1.0.4/dist/tableToExcel.min.js"></script>

  <!-- =======PDF FORMAT EXPORT CDN============================== -->
 <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>


</body>


</html>
