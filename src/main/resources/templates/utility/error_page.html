<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-linear-to-br from-gray-50 to-gray-100 min-h-screen flex items-center justify-center px-4">
  <div class="max-w-md w-full text-center">
    <!-- Error Code -->
    <h1 class="text-8xl font-extrabold text-gray-800 tracking-tight">404</h1>
    

    <div class="pt-10">
      <div th:replace="~{/utility/messages :: messagebox}"></div>
    </div>


    <!-- CTA Button -->
    <div class="mt-8">
      <a
        href="/"
        class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition"
      >
        Go back home
      </a>
    </div>
  </div>
</body>
</html>
