<div th:fragment="messagebox"
     th:if="${session.message}"
     th:object="${session.message}"
     class="flex items-start gap-3 p-4 mb-4 rounded-lg border shadow-sm"
     th:classappend="${
       session.message.type == 'success' ? 'bg-green-50 border-green-200 text-green-800' :
       session.message.type == 'error'   ? 'bg-red-50 border-red-200 text-red-800' :
       session.message.type == 'warning' ? 'bg-amber-50 border-amber-200 text-amber-800' :
                                          'bg-blue-50 border-blue-200 text-blue-800'
     }"
     role="alert">

  <!-- Icon -->
  <svg th:if="${session.message.type == 'success'}"
       class="w-5 h-5 mt-0.5 shrink-0 text-green-600"
       xmlns="http://www.w3.org/2000/svg"
       fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>

  <svg th:if="${session.message.type == 'error'}"
       class="w-5 h-5 mt-0.5 shrink-0 text-red-600"
       xmlns="http://www.w3.org/2000/svg"
       fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>

  <svg th:if="${session.message.type == 'warning'}"
       class="w-5 h-5 mt-0.5 shrink-0 text-amber-600"
       xmlns="http://www.w3.org/2000/svg"
       fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
  </svg>

  <svg th:if="${session.message.type == 'info' || session.message.type == null}"
       class="w-5 h-5 mt-0.5 shrink-0 text-blue-600"
       xmlns="http://www.w3.org/2000/svg"
       fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>

  <!-- Message -->
  <p class="text-sm font-medium leading-relaxed">
    <span th:text="${session.message.notification}"></span>
  </p>

  <!-- Remove session helper (unchanged logic) -->
  <th:block th:text="${@sessionRemoveHelper.removeSession()}"></th:block>
</div>
