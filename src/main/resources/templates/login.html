<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{/utility/common :: parent( ~{}, ~{:: #loginForm} ,~{::title} )}">

<head>
  <title>SCM - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center">

  <div id="loginForm" class="w-full flex items-center justify-center p-4">
    
    <div class="w-full max-w-md bg-white shadow-xl rounded-3xl p-8 border border-slate-100 transition-all duration-300">

      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
        <p class="text-sm text-slate-500 mt-1">Please log in to your account to continue</p>
      </div>

      <div class="mb-6 space-y-2">
        <div th:if="${param.logout}" class="p-3 text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl text-center">
          You have been logged out successfully.
        </div>
        <div th:if="${param.error}" class="p-3 text-xs font-medium text-rose-700 bg-rose-50 border border-rose-200 rounded-xl text-center">
          Invalid Email or Password. Please try again.
        </div>
        <div th:replace="~{/utility/messages :: messagebox}"></div>
      </div>

      <form method="post" th:action="@{'/authentication'}" class="space-y-4">

        <div class="space-y-1.5 text-left">
          <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider" for="email">Email Address</label>
          <div class="relative">
            <input type="email" name="email" id="email" placeholder="name@example.com"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition-all duration-200"
              required />
          </div>
        </div>

        <div class="space-y-1.5 text-left">
          <div class="flex items-center justify-between">
            <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider" for="password">Password</label>
          </div>
          <div class="relative">
            <input type="password" name="password" id="password" placeholder="••••••••"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition-all duration-200"
              required />
          </div>
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button type="submit"
            class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 transform hover:-translate-y-0.5">
            Login
          </button>
          <button type="reset"
            class="py-3 px-4 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-semibold rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-400 transition-all duration-200">
            Reset
          </button>
        </div>

        <div class="text-center pt-2">
          <p class="text-xs text-slate-500">
            Don't have an account? 
            <a class="text-indigo-600 font-semibold hover:underline" th:href="@{'/register'}">Sign up here</a>
          </p>
        </div>
      </form>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-white px-3 text-slate-400 font-medium">Or continue with</span>
        </div>
      </div>

      <div class="flex flex-col gap-3 items-center">

        <a th:href="@{'/oauth2/authorization/google'}"
          class="w-full flex items-center justify-center rounded-xl shadow-sm px-4 py-3 text-xs font-semibold bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 hover:border-slate-300 transition-all duration-200 group">
          <svg class="h-4 w-4 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 0 48 48">
            <g fill="none" fill-rule="evenodd">
              <g transform="translate(-401 -860)">
                <g transform="translate(401 860)">
                  <path d="M9.827 24c0-1.524.253-2.986.705-4.356L2.623 13.604A23.864 23.864 0 00.214 24c0 3.737.868 7.261 2.407 10.388l7.904-6.051C10.077 26.973 9.827 25.517 9.827 24" fill="#FBBC05" />
                  <path d="M23.714 10.133c3.311 0 6.302 1.174 8.652 3.094L39.202 6.4C35.036 2.773 29.695.533 23.714.533c-9.287 0-17.268 5.311-21.09 13.071l7.909 6.04c1.822-5.532 7.017-9.511 13.181-9.511" fill="#EB4335" />
                  <path d="M23.714 37.867c-6.165 0-11.359-3.979-13.182-9.51l-7.908 6.037c3.822 7.761 11.803 13.072 21.09 13.072 5.732 0 11.205-2.036 15.311-5.849l-7.507-5.804c-2.118 1.335-4.786 2.054-7.804 2.054" fill="#34A853" />
                  <path d="M46.145 24c0-1.387-.213-2.88-.534-4.267H23.714V28.8h12.604c-.63 3.091-2.346 5.468-4.8 7.014l7.507 5.804C43.34 37.614 46.145 31.649 46.145 24" fill="#4285F4" />
                </g>
              </g>
            </g>
          </svg>
          <span>Continue with Google</span>
        </a>

        <a th:href="@{'/oauth2/authorization/github'}"
          class="w-full flex items-center justify-center rounded-xl shadow-sm px-4 py-3 text-xs font-semibold bg-slate-900 hover:bg-slate-800 border border-slate-900 text-white transition-all duration-200 group">
          <svg class="h-4 w-4 mr-3 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 73">
            <g fill="none" fill-rule="evenodd">
              <g transform="translate(2 2)" fill-rule="nonzero">
                <path d="M58.307 21.428c-2.411-4.131-5.682-7.401-9.812-9.812C44.364 9.205 39.854 8 34.961 8c-4.891 0-9.403 1.205-13.533 3.616-4.131 2.41-7.401 5.681-9.812 9.812C9.205 25.559 8 30.07 8 34.961c0 5.875 1.714 11.158 5.143 15.85 3.428 4.693 7.858 7.94 13.287 9.742.631.117 1.099.035 1.403-.245.304-.281.456-.632.456-1.053 0-.07-.006-.702-.018-1.896-.012-1.194-.018-2.235-.018-3.124l-.808.14c-.515.094-1.164.134-1.948.123-.784-.011-1.598-.093-2.44-.246-.843-.151-1.627-.502-2.353-1.052-.725-.55-1.24-1.27-1.544-2.159l-.351-.808c-.234-.538-.602-1.135-1.106-1.79-.503-.656-1.012-1.1-1.527-1.334l-.246-.176c-.164-.117-.316-.258-.456-.422-.141-.163-.246-.327-.317-.491-.07-.164-.012-.299.176-.404.187-.106.526-.157 1.018-.157l.702.105c.468.094 1.047.374 1.738.842.69.468 1.258 1.077 1.703 1.826.538.96 1.187 1.691 1.948 2.194.76.503 1.527.755 2.299.755.773 0 1.44-.059 2.002-.175.561-.117 1.088-.293 1.58-.527.21-1.569.784-2.774 1.72-3.616-1.334-.14-2.533-.351-3.598-.632-1.065-.281-2.165-.737-3.3-1.37-1.135-.631-2.077-1.416-2.826-2.352-.749-.936-1.363-2.165-1.843-3.687-.48-1.521-.72-3.276-.72-5.265 0-2.833.925-5.243 2.774-7.233-.89-2.129-.808-4.516.246-7.16.677-.212 1.684-.05 3.018.476 1.334.527 2.311.978 2.931 1.352.621.374 1.118.691 1.492.948 2.177-.608 4.424-.912 6.741-.912 2.317 0 4.564.304 6.741.912l1.335-.842c.913-.562 1.99-1.077 3.23-1.545 1.24-.468 2.189-.597 2.844-.386 1.053 2.645 1.147 5.032.281 7.162 1.85 1.99 2.774 4.401 2.774 7.233 0 1.99-.24 3.75-.72 5.284-.48 1.533-1.095 2.762-1.843 3.686-.749.925-1.697 1.703-2.844 2.335-1.147.632-2.247 1.088-3.3 1.369-1.053.281-2.264.492-3.633.633 1.217 1.053 1.826 2.715 1.826 4.985v7.392c0 .421.147.773.44 1.053.293.281.755.363 1.387.246 5.43-1.802 9.859-5.049 13.288-9.742 3.428-4.693 5.142-9.976 5.142-15.85 0-4.892-1.206-9.403-3.616-13.534z" fill="#FFF"/>
              </g>
            </g>
          </svg>
          <span>Continue with Github</span>
        </a>

      </div>

    </div>
  </div>

</body>

</html>
