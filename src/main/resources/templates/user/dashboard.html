<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="/utility/common :: parent (~{}, ~{:: .userProfile}, ~{:: title}) ">

<head>
  <title th:text="${loggedInUser.name} + ' - Dashboard | SCM' "></title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 font-sans antialiased">

  <div class="userProfile flex min-h-screen">

    <div th:if="${loggedInUser}" class="flex-shrink-0">
      <div th:replace="~{/user/sidebar :: sidebar}"></div>
    </div>

    <div class="flex-1 p-6 md:p-10">
      
      <div class="mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
          <span class="inline-block py-1 px-3 rounded-full bg-indigo-50 text-indigo-600 text-xs font-semibold tracking-wider uppercase mb-2">
            Dashboard Overview
          </span>
          <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900" th:text="'Welcome back, ' + ${loggedInUser.name} + '!'">
            Welcome to your Dashboard
          </h1>
          <p class="text-sm text-slate-500 mt-1">Here is a quick summary of your saved contact details and shortcuts.</p>
        </div>
        <div>
          <a th:href="@{/user/contact/add}" class="inline-flex items-center justify-center px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-indigo-100 transition-all">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Add New Contact
          </a>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between transition-all hover:shadow-md">
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Total Contacts</p>
            <h3 class="text-3xl font-extrabold text-slate-900" th:text="${totalContacts != null ? totalContacts : '0'}">0</h3>
            <p class="text-xs text-slate-500 mt-1">Saved in your directory</p>
          </div>
          <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center shadow-inner">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
          </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between transition-all hover:shadow-md">
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Favorite Contacts</p>
            <h3 class="text-3xl font-extrabold text-amber-500" th:text="${favoriteContacts != null ? favoriteContacts : '0'}">0</h3>
            <p class="text-xs text-slate-500 mt-1">Marked as important</p>
          </div>
          <div class="w-14 h-14 bg-amber-50 text-amber-500 rounded-2xl flex items-center justify-center shadow-inner">
            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
            </svg>
          </div>
        </div>

      </div>

      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-lg font-bold text-slate-900 mb-4">Quick Navigation</h2>
        <div class="flex flex-wrap gap-4">
          <a th:href="@{/user/contact}" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            View All Contacts
          </a>
          <a th:href="@{/user/profile}" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            Edit Profile
          </a>
        </div>
      </div>

    </div>

  </div>

</body>

</html>
