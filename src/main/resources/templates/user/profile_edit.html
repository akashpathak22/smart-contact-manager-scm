<!DOCTYPE html>
<html lang="en" th:replace="~{/utility/common :: parent (~{}, ~{:: .userProfile}, ~{ ::title}) }">

<head>
  <title>Edit Profile - SCM</title>
</head>

<body>
  <div class="userProfile flex min-h-screen bg-gray-50/50">

    <div th:if="${loggedInUser}">
      <div th:replace="~{/user/sidebar :: sidebar }"></div>
    </div>

    <div class="m-auto w-full min-h-screen py-8 px-4 sm:px-6 lg:px-8 sm:pl-72">
      
        <div th:replace="~{/utility/messages :: messagebox}"></div>

      <div class="max-w-3xl mx-auto space-y-6">


        <div class="pb-4 border-b border-gray-200">
          <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Edit Profile</h1>
          <p class="text-sm text-gray-500 mt-1">Update your personal details and account information.</p>
        </div>

        <div class="bg-white rounded-3xl border border-gray-200/80 shadow-sm p-6 sm:p-10">

          <form novalidate method="post"
           th:action="@{'/user/profile/update/'+ ${userProfile.userId}}"
            th:object="${userProfile}"
            enctype="multipart/form-data"

            class="space-y-6">

            <input type="hidden" th:field="*{userId}" />

            <div class="flex flex-col gap-1.5">
              <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider" for="name">Full Name</label>
              <input type="text" th:field="*{name}" id="name"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 outline-none focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition"
                required />
            </div>

            <div class="flex flex-col gap-1.5">
              <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider" for="email">Email Address
                (Read Only)</label>
              <input type="email" th:field="*{email}" id="email"
                class="w-full bg-gray-100 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-500 outline-none cursor-not-allowed"
                readonly />
            </div>

            <div class="flex flex-col gap-1.5">
              <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider" for="mobile">Mobile
                Number</label>
                
                <p th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" class="text-xs text-red-600 py-2 px-1"></p>


              <input type="text" th:field="*{mobile}" id="mobile" placeholder="Enter phone number"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 outline-none focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition" />
            </div>

            <div class="flex flex-col gap-1.5">
              <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider" for="profileLink">Profile
                Picture </label>
                 <p th:if="${#fields.hasErrors('profileLink')}" th:errors="*{profileLink}" class="text-xs text-red-600 py-2 px-1"></p>

              <input id="user_profile_edit_preview" type="file" th:field="*{profileLink}"
                class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 transition cursor-pointer border border-gray-300 rounded" />

              <img th:src="${userProfile.profileLink}" class="w-32 h-32 border-2 rounded-2xl border-red-400  mx-auto" src="" alt="" id="uploaded_image_preview">
            </div>


            <div class="flex flex-col gap-1.5">
              <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider" for="about">About Bio</label>
               <p th:if="${#fields.hasErrors('about')}" th:errors="*{about}" class="text-xs text-red-600 py-2 px-1"></p>
              <textarea th:field="*{about}" id="about" rows="4" placeholder="Write something about yourself..."
                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 outline-none focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition"></textarea>
            </div>

            <div class="flex items-center gap-3 pt-4">
              <button type="submit"
                class="flex-1 py-3 px-6 bg-gray-900 hover:bg-gray-800 text-white font-semibold rounded-xl text-sm transition shadow-sm">
                Save Changes
              </button>
              <a th:href="@{/user/profile}"
                class="py-3 px-6 bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 font-semibold rounded-xl text-sm transition text-center">
                Cancel
              </a>
            </div>

          </form>

        </div>

      </div>
    </div>

  </div>
</body>

</html>
